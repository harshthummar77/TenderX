<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TenderX — Plan. Personalize. Pursue.</title>
    <!--
      No-flash theme: set the attribute before first paint so a stored dark/light
      preference never flashes the wrong palette. No stored preference => no
      attribute => the prefers-color-scheme media query in index.css governs.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tb.theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter for the interface, JetBrains Mono for every figure. The money
      typography rule in plan 16 §4 depends on the mono face actually loading.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
